apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: itour-ingress
  namespace: itour-production
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Force HTTPS + apply security headers (HSTS, etc.) to ALL routes.
    # Middleware ref format: <namespace>-<name>@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: >-
      itour-production-redirect-https@kubernetescrd,itour-production-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: fulvago.itourtt.cloud
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3001
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
  tls:
    - hosts:
        - fulvago.itourtt.cloud
      secretName: fulvago-tls
